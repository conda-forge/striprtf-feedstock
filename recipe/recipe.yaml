schema_version: 1

context:
  name: striprtf
  version: "0.0.34"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/striprtf-${{ version }}.tar.gz
  sha256: 0c46348df545f0a43e357d1387ab6a3eb9e23b22ade1e77191550b129c05b2a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - twine

tests:
  - python:
      imports:
        - striprtf
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A simple library to convert rtf to text
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/joshy/striprtf

extra:
  recipe-maintainers:
    - jan-janssen
