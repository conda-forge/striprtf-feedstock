schema_version: 1

context:
  name: striprtf
  version: "0.0.33"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/striprtf-${{ version }}.tar.gz
  sha256: c2d3d9ff3118df6dab558675f10a31ff8bb999ac1f8921f00c6dc9ea19961f18

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - twine

tests:
  - python:
      imports:
        - striprtf
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A simple library to convert rtf to text
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/joshy/striprtf

extra:
  recipe-maintainers:
    - jan-janssen
